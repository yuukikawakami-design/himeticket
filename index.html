<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ヒメチケ | 社内チケット譲渡ボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100/80 text-slate-800 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">
  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-slate-900 via-blue-900 to-indigo-900 text-white shadow-lg sticky top-0 z-30 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-white/15 ring-1 ring-white/25 backdrop-blur-md flex items-center justify-center text-2xl shadow-inner">
          🎫
        </div>
        <div>
          <div class="flex items-center gap-2.5">
            <h1 class="text-xl sm:text-2xl font-black tracking-tight">ヒメチケ</h1>
            <span class="text-[10px] font-extrabold uppercase tracking-widest bg-amber-400 text-slate-950 px-2.5 py-0.5 rounded-full shadow-xs">
              HIME-TICKET
            </span>
          </div>
          <p class="text-xs text-blue-100/90 mt-0.5">職場内チケット譲渡・お譲り先マッチングボード</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <button
          id="open-post-modal-btn"
          type="button"
          class="bg-amber-400 hover:bg-amber-300 active:scale-[0.99] text-slate-950 font-extrabold text-sm px-4 py-2.5 rounded-xl shadow-md hover:shadow-lg transition flex items-center gap-1.5 cursor-pointer"
        >
          <span class="text-base leading-none">＋</span>
          <span>チケットを出品する</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ステータス＆検索・フィルタエリア -->
  <section class="max-w-6xl w-full mx-auto px-4 sm:px-6 pt-6 space-y-4">
    <div id="status-banner" class="rounded-2xl border border-slate-200/90 bg-white/95 shadow-xs px-4 py-3 text-sm text-slate-700 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <span id="status-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
        <span id="status-text" class="truncate text-xs sm:text-sm font-medium">最新の残席情報を取得しています…</span>
      </div>
      <span id="ticket-count" class="text-xs font-extrabold bg-slate-100 text-slate-700 border border-slate-200 px-3 py-1 rounded-full shrink-0">
        0件
      </span>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200/90 shadow-xs p-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      <div class="relative flex-1">
        <input
          id="search-input"
          type="text"
          placeholder="イベント名・会場・出品者・備考で検索"
          class="w-full rounded-xl border border-slate-200 bg-slate-50/80 focus:bg-white focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 px-4 py-2.5 text-sm outline-none transition"
        />
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button
          type="button"
          data-filter="all"
          class="filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-xs transition cursor-pointer"
        >
          すべて
        </button>
        <button
          type="button"
          data-filter="available"
          class="filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition cursor-pointer"
        >
          譲渡可能のみ
        </button>
        <button
          type="button"
          data-filter="free"
          class="filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition cursor-pointer"
        >
          無料（0円）
        </button>
      </div>
    </div>
  </section>

  <!-- チケット一覧 -->
  <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 flex-1">
    <div id="ticket-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- カードがJavaScriptで描画されます -->
    </div>

    <div id="empty-state" class="hidden text-center py-16 px-4 bg-white rounded-3xl border border-dashed border-slate-300 shadow-2xs">
      <p class="text-4xl mb-3">🎟️</p>
      <p class="font-bold text-slate-800">条件に合うチケットが見つかりませんでした</p>
      <p class="text-sm text-slate-500 mt-1">検索条件を変えるか、新しいチケットを出品してみてください。</p>
    </div>
  </main>

  <!-- フッター -->
  <footer class="border-t border-slate-200/80 bg-white py-5 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span class="font-medium text-slate-600">ヒメチケ（HIME-TICKET）— 職場内チケット譲渡ボード</span>
      <span>受け渡し方法・金額の詳細は社内ルールに沿ってご確認ください</span>
    </div>
  </footer>

  <!-- 出品モーダル -->
  <div id="post-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden my-auto">
      <div class="px-6 py-4 bg-gradient-to-r from-slate-900 to-blue-900 text-white flex items-center justify-between">
        <h2 class="font-extrabold text-lg">チケットを出品する</h2>
        <button id="close-post-modal-btn" type="button" class="text-slate-300 hover:text-white text-2xl leading-none cursor-pointer">×</button>
      </div>

      <form id="post-ticket-form" class="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">イベント名・チケット名 *</label>
          <input
            name="title"
            type="text"
            required
            placeholder="例：〇〇フェス 1日券 / 映画ペア鑑賞券"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">開催日・有効期限 *</label>
            <input
              name="eventDate"
              type="text"
              required
              placeholder="例：2026年12月15日 / 2027年3月末まで"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">会場・利用場所</label>
            <input
              name="venue"
              type="text"
              placeholder="例：グリーンランド / 全国対象劇場"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">1枚あたり料金（税込円） *</label>
            <input
              name="price"
              type="number"
              min="0"
              step="1"
              required
              value="0"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
            />
            <p class="text-[11px] text-slate-500 mt-1">※0円入力で「無料」表示</p>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">譲渡可能枚数 *</label>
            <input
              name="quantity"
              type="number"
              min="1"
              step="1"
              required
              value="2"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">出品者名（部署・ニックネーム可） *</label>
            <input
              name="sellerName"
              type="text"
              required
              placeholder="例：企画管理室 川上"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">受け渡し方法</label>
            <input
              name="handover"
              type="text"
              placeholder="例：社内 / オフィス手渡し"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
            />
          </div>
        </div>

        <!-- チケット画像アップロード（自動縮小） -->
        <div class="rounded-2xl border border-slate-200 bg-slate-50/70 p-3.5">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <label for="ticket-image-input" class="text-xs font-bold text-slate-700">
              チケット画像・フライヤー写真（任意）
            </label>
            <button
              id="clear-image-btn"
              type="button"
              class="hidden text-[11px] font-bold text-rose-600 hover:underline cursor-pointer"
            >
              画像を削除
            </button>
          </div>
          <input
            id="ticket-image-input"
            type="file"
            accept="image/*"
            class="block w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
          />
          <p class="text-[11px] text-slate-500 mt-1.5">
            ※選択した画像は自動で縮小・軽量化されて保存されます（個人情報の写り込みにご注意ください）。
          </p>
          <div id="image-preview-wrap" class="hidden mt-3">
            <img
              id="image-preview"
              src=""
              alt="選択されたチケット画像プレビュー"
              class="w-full max-h-44 object-cover rounded-xl border border-slate-200 bg-white"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">備考・座席情報など</label>
          <textarea
            name="notes"
            rows="2"
            placeholder="例：大人・子供共通券 先着順"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
          ></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button
            id="cancel-post-btn"
            type="button"
            class="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition cursor-pointer"
          >
            キャンセル
          </button>
          <button
            id="submit-post-btn"
            type="submit"
            class="px-5 py-2.5 rounded-xl text-sm font-extrabold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition cursor-pointer"
          >
            出品を登録する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 譲り受け申込モーダル -->
  <div id="claim-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 bg-gradient-to-r from-blue-700 to-indigo-700 text-white flex items-center justify-between">
        <h2 class="font-extrabold text-lg">チケットを譲り受ける</h2>
        <button id="close-claim-modal-btn" type="button" class="text-blue-100 hover:text-white text-2xl leading-none cursor-pointer">×</button>
      </div>

      <form id="claim-ticket-form" class="p-6 space-y-4">
        <div id="claim-ticket-summary" class="rounded-2xl bg-slate-50 border border-slate-200 p-3.5 text-sm">
          <!-- 対象チケット情報 -->
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">希望枚数 *</label>
          <input
            id="claim-quantity-input"
            name="claimQuantity"
            type="number"
            min="1"
            step="1"
            required
            value="1"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">お名前（部署・ニックネーム可） *</label>
          <input
            name="requesterName"
            type="text"
            required
            placeholder="例：企画部 佐藤"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">連絡メモ・受け渡し希望</label>
          <input
            name="requesterNote"
            type="text"
            placeholder="例：本日の15時以降にデスクへ伺えます"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 outline-none"
          />
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button
            id="cancel-claim-btn"
            type="button"
            class="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition cursor-pointer"
          >
            キャンセル
          </button>
          <button
            type="submit"
            class="px-5 py-2.5 rounded-xl text-sm font-extrabold bg-amber-400 hover:bg-amber-300 text-slate-950 shadow-sm transition cursor-pointer"
          >
            譲り受けを確定する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase v10 (Modular ESM) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2u9hI8R0_yG7qK1vX5mN3pL8oW4eT6zY",
      authDomain: "himeticket-523fa.firebaseapp.com",
      projectId: "himeticket-523fa",
      storageBucket: "himeticket-523fa.appspot.com",
      messagingSenderId: "849201736512",
      appId: "1:849201736512:web:9c8d7e6f5a4b3c2d1e0f9a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ticketsCol = collection(db, "tickets");

    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const ticketCountEl = document.getElementById("ticket-count");
    const ticketGrid = document.getElementById("ticket-grid");
    const emptyState = document.getElementById("empty-state");
    const searchInput = document.getElementById("search-input");
    const filterButtons = document.querySelectorAll(".filter-btn");

    const postModal = document.getElementById("post-modal");
    const postForm = document.getElementById("post-ticket-form");
    const submitPostBtn = document.getElementById("submit-post-btn");
    const imageInput = document.getElementById("ticket-image-input");
    const clearImageBtn = document.getElementById("clear-image-btn");
    const imagePreviewWrap = document.getElementById("image-preview-wrap");
    const imagePreview = document.getElementById("image-preview");

    const claimModal = document.getElementById("claim-modal");
    const claimForm = document.getElementById("claim-ticket-form");
    const claimSummary = document.getElementById("claim-ticket-summary");
    const claimQtyInput = document.getElementById("claim-quantity-input");

    let allTickets = [];
    let currentFilter = "all";
    let searchQuery = "";
    let selectedTicket = null;
    let uploadedImageDataUrl = "";
    let seededOnce = false;

    const SAMPLE_TICKETS = [
      {
        title: "九州ウィンターイルミネーション 招待券",
        eventDate: "2026年12月25日まで有効",
        venue: "福岡市内特設会場",
        price: 0,
        quantity: 2,
        sellerName: "総務部 田中",
        handover: "社内チャット / 3F休憩室",
        notes: "ご家族や同僚の方とぜひどうぞ。期限内にご利用ください。",
        imageUrl: "",
        claims: []
      },
      {
        title: "年末スペシャルコンサート 指定席",
        eventDate: "2026年12月20日 18:00開演",
        venue: "福岡サンパレス",
        price: 5500,
        quantity: 2,
        sellerName: "開発部 鈴木",
        handover: "オフィス手渡し",
        notes: "定価以下でお譲りします。1枚からでも相談可能です。",
        imageUrl: "",
        claims: []
      }
    ];

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatPrice(price) {
      const num = Number(price) || 0;
      return num === 0 ? "無料" : `¥${num.toLocaleString("ja-JP")}`;
    }

    function setBannerStatus(mode, message) {
      statusText.textContent = message;
      statusDot.classList.remove("bg-amber-400", "bg-emerald-500", "bg-rose-500", "animate-pulse");
      if (mode === "ok") {
        statusDot.classList.add("bg-emerald-500");
      } else if (mode === "error") {
        statusDot.classList.add("bg-rose-500");
      } else {
        statusDot.classList.add("bg-amber-400", "animate-pulse");
      }
    }

    function compressImageFile(file, maxWidth = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            if (dataUrl.length > 750000) {
              reject(new Error("画像サイズが大きすぎます。別の画像をお選びください。"));
              return;
            }
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("ファイルの読み込みに失敗しました。"));
        reader.readAsDataURL(file);
      });
    }

    function resetImageSelection() {
      uploadedImageDataUrl = "";
      imageInput.value = "";
      imagePreview.src = "";
      imagePreviewWrap.classList.add("hidden");
      clearImageBtn.classList.add("hidden");
    }

    imageInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) {
        resetImageSelection();
        return;
      }
      try {
        setBannerStatus("loading", "画像を最適化しています…");
        const compressed = await compressImageFile(file);
        uploadedImageDataUrl = compressed;
        imagePreview.src = compressed;
        imagePreviewWrap.classList.remove("hidden");
        clearImageBtn.classList.remove("hidden");
        setBannerStatus("ok", "画像を読み込みました。出品時に一緒に保存されます。");
      } catch (err) {
        console.error(err);
        resetImageSelection();
        setBannerStatus("error", err.message || "画像の処理に失敗しました。");
      }
    });

    clearImageBtn.addEventListener("click", () => {
      resetImageSelection();
    });

    async function seedInitialTicketsIfEmpty() {
      if (seededOnce) return;
      seededOnce = true;
      for (const sample of SAMPLE_TICKETS) {
        await addDoc(ticketsCol, {
          ...sample,
          createdAt: serverTimestamp()
        });
      }
    }

    function renderTickets() {
      const qText = searchQuery.trim().toLowerCase();

      const filtered = allTickets.filter((t) => {
        const qty = Number(t.quantity) || 0;
        const price = Number(t.price) || 0;

        if (currentFilter === "available" && qty <= 0) return false;
        if (currentFilter === "free" && price !== 0) return false;

        if (!qText) return true;
        const haystack = [
          t.title,
          t.venue,
          t.sellerName,
          t.eventDate,
          t.notes
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return haystack.includes(qText);
      });

      ticketCountEl.textContent = `${filtered.length}件`;

      if (filtered.length === 0) {
        ticketGrid.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      ticketGrid.innerHTML = filtered
        .map((t) => {
          const qty = Number(t.quantity) || 0;
          const isAvailable = qty > 0;
          const priceLabel = formatPrice(t.price);
          const isFree = (Number(t.price) || 0) === 0;
          const claims = Array.isArray(t.claims) ? t.claims : [];
          const hasImage = typeof t.imageUrl === "string" && t.imageUrl.startsWith("data:image/");

          return `
            <article class="bg-white rounded-3xl border border-slate-200/90 shadow-xs hover:shadow-md transition flex flex-col justify-between overflow-hidden">
              <div>
                ${
                  hasImage
                    ? `<div class="aspect-[16/10] w-full bg-slate-100 border-b border-slate-100 overflow-hidden">
                        <img
                          src="${t.imageUrl}"
                          alt="${escapeHtml(t.title)}"
                          class="w-full h-full object-cover"
                        />
                      </div>`
                    : ""
                }

                <div class="px-5 pt-5 pb-3 flex items-center justify-between gap-2">
                  <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold ${
                    isAvailable
                      ? "bg-emerald-50 text-emerald-700 border border-emerald-200"
                      : "bg-slate-100 text-slate-500 border border-slate-200"
                  }">
                    ${isAvailable ? `残り ${qty} 枚` : "譲渡完了"}
                  </span>
                  <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-black ${
                    isFree
                      ? "bg-amber-100 text-amber-950"
                      : "bg-blue-50 text-blue-900 border border-blue-100"
                  }">
                    ${priceLabel} / 枚
                  </span>
                </div>

                <div class="px-5 pb-4">
                  <h3 class="text-lg font-black text-slate-900 leading-snug">${escapeHtml(t.title)}</h3>
                  <dl class="mt-3.5 space-y-1.5 text-xs text-slate-600">
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">日時・期限</dt>
                      <dd class="text-slate-800 font-semibold">${escapeHtml(t.eventDate || "未指定")}</dd>
                    </div>
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">会場・場所</dt>
                      <dd class="text-slate-700">${escapeHtml(t.venue || "未指定")}</dd>
                    </div>
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">出品者</dt>
                      <dd class="text-slate-800 font-bold">${escapeHtml(t.sellerName || "社内メンバー")}</dd>
                    </div>
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">受け渡し</dt>
                      <dd class="text-slate-700">${escapeHtml(t.handover || "相談の上決定")}</dd>
                    </div>
                  </dl>

                  ${
                    t.notes
                      ? `<p class="mt-3.5 text-xs text-slate-600 bg-slate-50 rounded-2xl p-3 border border-slate-100 leading-relaxed">${escapeHtml(t.notes)}</p>`
                      : ""
                  }

                  ${
                    claims.length > 0
                      ? `
                        <div class="mt-3.5 pt-3 border-t border-slate-100">
                          <p class="text-[11px] font-bold text-slate-500 mb-1.5">譲り受け履歴</p>
                          <ul class="space-y-1">
                            ${claims
                              .map(
                                (c) => `
                              <li class="text-xs text-slate-700 flex items-center justify-between gap-2 bg-blue-50/70 px-3 py-1.5 rounded-xl">
                                <span class="font-semibold">${escapeHtml(c.requesterName)}（${Number(c.quantity) || 1}枚）</span>
                                <span class="text-[11px] text-slate-500 truncate">${escapeHtml(c.note || "")}</span>
                              </li>`
                              )
                              .join("")}
                          </ul>
                        </div>`
                      : ""
                  }
                </div>
              </div>

              <div class="px-5 py-3.5 bg-slate-50/90 border-t border-slate-100 flex items-center justify-between gap-2">
                <button
                  type="button"
                  data-delete-id="${escapeHtml(t.id)}"
                  data-delete-title="${escapeHtml(t.title)}"
                  class="delete-btn px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition cursor-pointer"
                >
                  削除
                </button>

                ${
                  isAvailable
                    ? `<button
                        type="button"
                        data-claim-id="${escapeHtml(t.id)}"
                        class="claim-btn px-4 py-2 rounded-xl text-xs font-extrabold bg-blue-600 hover:bg-blue-700 text-white shadow-xs transition cursor-pointer"
                      >
                        譲り受ける
                      </button>`
                    : `<span class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-200 text-slate-500">
                        受付終了
                      </span>`
                }
              </div>
            </article>
          `;
        })
        .join("");

      document.querySelectorAll(".claim-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-claim-id");
          const target = allTickets.find((item) => item.id === id);
          if (!target) return;
          openClaimModal(target);
        });
      });

      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-delete-id");
          const title = btn.getAttribute("data-delete-title") || "このチケット";
          if (!id) return;
          const ok = window.confirm(`「${title}」を削除しますか？\n削除すると元に戻せません。`);
          if (!ok) return;

          try {
            await deleteDoc(doc(db, "tickets", id));
            setBannerStatus("ok", `「${title}」を削除しました。`);
          } catch (err) {
            console.error(err);
            setBannerStatus("error", "削除に失敗しました。通信状況をご確認ください。");
          }
        });
      });
    }

    // 出品モーダル制御
    function openPostModal() {
      postForm.reset();
      resetImageSelection();
      postModal.classList.remove("hidden");
      postModal.classList.add("flex");
    }

    function closePostModal() {
      postModal.classList.add("hidden");
      postModal.classList.remove("flex");
    }

    document.getElementById("open-post-modal-btn").addEventListener("click", openPostModal);
    document.getElementById("close-post-modal-btn").addEventListener("click", closePostModal);
    document.getElementById("cancel-post-btn").addEventListener("click", closePostModal);

    postForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitPostBtn.disabled = true;
      submitPostBtn.textContent = "登録中…";

      const fd = new FormData(postForm);
      const price = Math.max(0, Number(fd.get("price")) || 0);
      const quantity = Math.max(1, Number(fd.get("quantity")) || 1);

      try {
        await addDoc(ticketsCol, {
          title: String(fd.get("title") || "").trim(),
          eventDate: String(fd.get("eventDate") || "").trim(),
          venue: String(fd.get("venue") || "").trim(),
          price,
          quantity,
          sellerName: String(fd.get("sellerName") || "").trim(),
          handover: String(fd.get("handover") || "").trim(),
          notes: String(fd.get("notes") || "").trim(),
          imageUrl: uploadedImageDataUrl || "",
          claims: [],
          createdAt: serverTimestamp()
        });
        closePostModal();
        setBannerStatus("ok", "チケットを出品しました。リアルタイムで反映されています。");
      } catch (err) {
        console.error(err);
        setBannerStatus("error", "出品の保存に失敗しました。Firestoreのルールや通信をご確認ください。");
      } finally {
        submitPostBtn.disabled = false;
        submitPostBtn.textContent = "出品を登録する";
      }
    });

    // 譲り受けモーダル制御
    function openClaimModal(ticket) {
      selectedTicket = ticket;
      const maxQty = Math.max(1, Number(ticket.quantity) || 1);
      claimQtyInput.max = String(maxQty);
      claimQtyInput.value = "1";
      claimSummary.innerHTML = `
        <p class="font-black text-slate-900">${escapeHtml(ticket.title)}</p>
        <p class="text-xs text-slate-600 mt-1">出品者：${escapeHtml(ticket.sellerName)} ／ 料金：${formatPrice(ticket.price)} / 枚 ／ 残り ${maxQty} 枚</p>
      `;
      claimForm.reset();
      claimQtyInput.value = "1";
      claimModal.classList.remove("hidden");
      claimModal.classList.add("flex");
    }

    function closeClaimModal() {
      selectedTicket = null;
      claimModal.classList.add("hidden");
      claimModal.classList.remove("flex");
    }

    document.getElementById("close-claim-modal-btn").addEventListener("click", closeClaimModal);
    document.getElementById("cancel-claim-btn").addEventListener("click", closeClaimModal);

    claimForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!selectedTicket) return;

      const maxQty = Number(selectedTicket.quantity) || 0;
      const takeQty = Math.max(1, Math.min(maxQty, Number(claimQtyInput.value) || 1));
      const fd = new FormData(claimForm);
      const requesterName = String(fd.get("requesterName") || "").trim();
      const requesterNote = String(fd.get("requesterNote") || "").trim();

      const nextQty = Math.max(0, maxQty - takeQty);
      const nextClaims = [
        ...(Array.isArray(selectedTicket.claims) ? selectedTicket.claims : []),
        {
          requesterName,
          quantity: takeQty,
          note: requesterNote
        }
      ];

      try {
        const docRef = doc(db, "tickets", selectedTicket.id);
        await updateDoc(docRef, {
          quantity: nextQty,
          claims: nextClaims
        });
        closeClaimModal();
        setBannerStatus("ok", `${takeQty}枚の譲り受け登録が完了しました。残席を更新しました。`);
      } catch (err) {
        console.error(err);
        setBannerStatus("error", "譲り受け処理に失敗しました。通信状況をご確認ください。");
      }
    });

    // 検索・フィルタ
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value || "";
      renderTickets();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentFilter = btn.getAttribute("data-filter") || "all";
        filterButtons.forEach((b) => {
          const active = b === btn;
          b.className = active
            ? "filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-xs transition cursor-pointer"
            : "filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition cursor-pointer";
        });
        renderTickets();
      });
    });

    // Firestore リアルタイム購読
    const q = query(ticketsCol, orderBy("createdAt", "desc"));
    onSnapshot(
      q,
      async (snapshot) => {
        if (snapshot.empty && !seededOnce) {
          await seedInitialTicketsIfEmpty();
          return;
        }
        allTickets = snapshot.docs.map((d) => ({
          id: d.id,
          ...d.data()
        }));
        setBannerStatus("ok", "データベース（Firestore）とリアルタイム同期中です。");
        renderTickets();
      },
      (err) => {
        console.error(err);
        setBannerStatus("error", "データベース（Firestore）との通信を確認してください。");
      }
    );
  </script>
</body>
</html>
