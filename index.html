        // Firestore リアルタイムリスナー設定（onSnapshot）
        function subscribeToRealtimeData() {
            let receivedInitialTickets = false;

            // ローディングが長時間残らないための安全タイマー
            const loadingFallbackTimer = setTimeout(() => {
                if (!receivedInitialTickets) {
                    document.getElementById('user-loading').classList.add('hidden');
                    renderUserTickets();
                }
            }, 4500);

            onSnapshot(getTicketsCol(), async (snapshot) => {
                clearTimeout(loadingFallbackTimer);
                receivedInitialTickets = true;
                isFirestoreReady = true;
                hideFirestoreNotice();

                ticketsList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                ticketsList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                // 初回起動時のみサンプルチケットを1度だけ自動投入（削除後も再生成しないフラグ管理）
                if (ticketsList.length === 0 && !isSeedRunning) {
                    await seedInitialTicketsIfNeverSeeded();
                }

                document.getElementById('user-loading').classList.add('hidden');
                renderUserTickets();
                if (isAdminAuthenticated) renderAdminDashboard();
            }, (error) => {
                clearTimeout(loadingFallbackTimer);
                receivedInitialTickets = true;
                isFirestoreReady = false;
                document.getElementById('user-loading').classList.add('hidden');
                console.error('Firestore チケット購読エラー:', error);

                if (error.code === 'permission-denied') {
                    showFirestoreNotice(
                        'Firestore のアクセス権限がありません（セキュリティルールをご確認ください）',
                        'Firebaseコンソールの Firestore Database →「ルール」タブで読み書きが許可されているか確認してください（テストモードまたは allow read, write: if true;）。'
                    );
                } else if (error.code === 'failed-precondition' || String(error.message || '').includes('database')) {
                    showFirestoreNotice(
                        'Firestore Database がまだ作成されていません',
                        'Firebaseコンソール（himeticket-523fa）の左メニュー「Firestore Database」から「データベースの作成」を実行してください。'
                    );
                } else {
                    showFirestoreNotice(
                        'Firestore との同期に問題が発生しました',
                        `詳細: ${error.message || error.code || '通信エラー'}`
                    );
                }
                renderUserTickets();
            });

            onSnapshot(getApplicationsCol(), (snapshot) => {
                applicationsList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                applicationsList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                if (isAdminAuthenticated) renderAdminDashboard();
            }, (error) => {
                console.error('Firestore 申し込み購読エラー:', error);
            });
        }

        // 初回セットアップ時のみサンプルチケットを登録（管理者が全削除した後は再投入しない）

        window.renderUserTickets = function() {
            const grid = document.getElementById('user-tickets-grid');
            const emptyState = document.getElementById('user-empty-state');

            const openTickets = ticketsList.filter(t => t.isOpen !== false);
            const favCount = openTickets.filter(t => favoriteTicketIds.has(t.id)).length;
            const favBadge = document.getElementById('fav-filter-count');
            if (favBadge) {
                favBadge.textContent = favCount > 0 ? `(${favCount})` : '';
            }

            let visibleTickets = openTickets;
            if (currentUserFilter === 'available') {
                visibleTickets = openTickets.filter(t => (t.remainingQuantity || 0) > 0);
            } else if (currentUserFilter === 'favorites') {
                visibleTickets = openTickets.filter(t => favoriteTicketIds.has(t.id));
            }

            document.getElementById('user-visible-count').textContent = `${visibleTickets.length}件`;

            if (visibleTickets.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = visibleTickets.map(ticket => {
                const rem = ticket.remainingQuantity ?? 0;
                const total = Math.max(ticket.totalQuantity ?? rem, 1);
                const isSoldOut = rem <= 0;
                const isLowStock = !isSoldOut && (rem <= 2 || (rem / total) <= 0.4);
                const isFav = favoriteTicketIds.has(ticket.id);

                let statusBadge = '';

                    statusBadge = `<span class="px-2 py-0.5 rounded-md text-[10px] sm:text-[11px] font-black bg-slate-800/85 text-white shadow-xs backdrop-blur-xs">予定枚数終了</span>`;

        // 申し込み＆詳細モーダルを開く

                        <div class="text-slate-700 font-medium text-[11px] space-y-0.5">
                            <div><i class="ph-fill ph-calendar-blank text-hime-blue"></i> ${escapeHTML(ticket.datetime)}</div>
                            <div><i class="ph-fill ph-map-pin text-hime-orange"></i> ${escapeHTML(ticket.venue)}</div>
                            <div class="font-bold text-slate-900"><i class="ph-fill ph-currency-jpy text-hime-blue"></i> ${ticket.price === 0 ? '無料招待' : '1枚 ¥' + Number(ticket.price).toLocaleString()}</div>
                        </div>
                    </div>
                </div>
                <div class="bg-white/90 border border-blue-200/80 rounded-lg p-2.5 text-[11px] text-slate-700">
                    <span class="font-black text-hime-blue block mb-0.5"><i class="ph-fill ph-info text-hime-orange"></i> 受け渡し窓口・持ち主メモ</span>
                    <span class="font-medium leading-relaxed">${escapeHTML(ticket.memo)}</span>
                </div>
            `;

            const formEl = document.getElementById('apply-form');
            const soldOutEl = document.getElementById('apply-soldout-notice');

            if (isSoldOut) {
                formEl.classList.add('hidden');
                soldOutEl.classList.remove('hidden');
                openModal('apply-modal');
                return;
            }

            soldOutEl.classList.add('hidden');
            formEl.classList.remove('hidden');

            const qtySelect = document.getElementById('apply-quantity');
            qtySelect.innerHTML = '';
            for (let i = 1; i <= rem; i++) {

        // ------------------------------------------------------------------
        // 3. 申し込み確定処理（Firestore runTransaction で原子的に在庫減算）
        // ------------------------------------------------------------------
        window.handleApplySubmit = async function(event) {
            event.preventDefault();
            if (!db) {
                showToast('Firestore に接続できていません', 'error');
                return;
            }

            const submitBtn = document.getElementById('apply-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span> 発券処理中...`;

            const ticketId = document.getElementById('apply-ticket-id').value;
            const quantity = parseInt(document.getElementById('apply-quantity').value, 10);
            const department = document.getElementById('apply-department').value.trim();
            const fullname = document.getElementById('apply-fullname').value.trim();
            const note = document.getElementById('apply-note').value.trim();

            localStorage.setItem(LOCAL_PROFILE_KEY, JSON.stringify({ department, fullname }));

            const receiptNo = '#HT-' + Math.floor(1000 + Math.random() * 9000);
            const now = new Date();
            const formattedNow = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            try {
                let confirmedTicketData = null;
                let totalPrice = 0;

                await runTransaction(db, async (transaction) => {
                    const tRef = getTicketDoc(ticketId);
                    const tSnap = await transaction.get(tRef);
                    if (!tSnap.exists()) {
                        throw new Error('対象の公演チケットが見つかりませんでした。');
                    }
                    const tData = tSnap.data();
                    if (tData.isOpen === false) {
                        throw new Error('この公演は現在受付を停止しています。');
                    }
                    const currentRemaining = tData.remainingQuantity || 0;
                    if (currentRemaining < quantity) {
                        throw new Error(`直前に他の方の申し込みがあり残席が不足しています（現在の残り枚数: ${currentRemaining}枚）。`);
                    }

                    confirmedTicketData = { id: tSnap.id, ...tData };
                    totalPrice = (tData.price || 0) * quantity;

                    transaction.update(tRef, {
                        remainingQuantity: currentRemaining - quantity
                    });

                    const newAppRef = doc(getApplicationsCol());
                    transaction.set(newAppRef, {
                        receiptNo,
                        ticketId,
                        ticketTitle: tData.title,
                        ticketDatetime: tData.datetime,
                        ticketVenue: tData.venue,
                        ticketMemo: tData.memo,
                        quantity,
                        unitPrice: tData.price || 0,
                        totalPrice,
                        department,
                        fullname,
                        note,
                        status: '未渡し',
                        createdAtStr: formattedNow,
                        createdAt: Date.now()
                    });
                });

                const voucherData = {
                    receiptNo,
                    createdAtStr: formattedNow,
                    ticketTitle: confirmedTicketData.title,
                    ticketDatetime: `${confirmedTicketData.datetime} / ${confirmedTicketData.venue}`,
                    applicant: `${department} ${fullname}`,
                    quantity,
                    totalPrice,
                    memo: confirmedTicketData.memo
                };
                saveReceiptToLocal(voucherData);

                closeModal('apply-modal');
                showVoucherModal(voucherData);
            } catch (error) {
                console.error('申し込み確定エラー:', error);
                showToast(error.message || '申し込み処理に失敗しました。再度お試しください。', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="ph-bold ph-check-circle text-lg"></i> 申し込みを確定する`;
            }
        };

        // 管理者：残席数の増減調整（＋1枚 / −1枚）
        window.adjustTicketStock = async function(ticketId, delta) {
            if (!db) return;
            try {
                await runTransaction(db, async (transaction) => {
                    const tRef = getTicketDoc(ticketId);
                    const tSnap = await transaction.get(tRef);
                    if (!tSnap.exists()) return;
                    const data = tSnap.data();
                    const curRem = data.remainingQuantity ?? 0;
                    const curTotal = data.totalQuantity ?? curRem;
                    const nextRem = Math.max(0, curRem + delta);
                    const nextTotal = delta > 0 ? Math.max(curTotal, nextRem) : curTotal;
                    transaction.update(tRef, {
                        remainingQuantity: nextRem,
                        totalQuantity: nextTotal
                    });
                });
                showToast(delta > 0 ? '残席を1枚増やしました' : '残席を1枚減らしました');
            } catch (err) {
                console.error(err);
                showToast('残席の調整に失敗しました', 'error');
            }
        };
