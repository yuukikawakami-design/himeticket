<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ヒメチケ | 社内チケット譲渡ボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-sky-700 via-blue-700 to-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/15 backdrop-blur flex items-center justify-center text-xl font-black shadow-inner">
          🎫
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-black tracking-tight">ヒメチケ</h1>
            <span class="text-[11px] font-bold uppercase tracking-wider bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full">
              HIME-TICKET
            </span>
          </div>
          <p class="text-xs text-sky-100 mt-0.5">職場内チケット譲渡・お譲り先マッチングボード</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <button
          id="open-post-modal-btn"
          type="button"
          class="bg-amber-400 hover:bg-amber-300 active:scale-[0.99] text-slate-950 font-bold text-sm px-4 py-2.5 rounded-xl shadow transition flex items-center gap-1.5 cursor-pointer"
        >
          <span>＋</span>
          <span>チケットを出品する</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ステータス＆フィルタバー -->
  <section class="max-w-6xl w-full mx-auto px-4 pt-6">
    <div id="status-banner" class="mb-4 rounded-2xl border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-900 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span id="status-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="status-text">最新の残席情報を取得しています…</span>
      </div>
      <span id="ticket-count" class="text-xs font-bold bg-white text-sky-800 border border-sky-200 px-2.5 py-1 rounded-full shrink-0">
        0件
      </span>
    </div>

    <!-- 検索＆絞り込み -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      <div class="relative flex-1">
        <input
          id="search-input"
          type="text"
          placeholder="イベント名・会場・出品者で検索（例：ライブ、映画、東京ドーム）"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 px-4 py-2.5 text-sm outline-none transition"
        />
      </div>
      <div class="flex items-center gap-2">
        <button
          type="button"
          data-filter="all"
          class="filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition cursor-pointer"
        >
          すべて
        </button>
        <button
          type="button"
          data-filter="available"
          class="filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition cursor-pointer"
        >
          譲渡可能のみ
        </button>
        <button
          type="button"
          data-filter="free"
          class="filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition cursor-pointer"
        >
          無料（0円）
        </button>
      </div>
    </div>
  </section>

  <!-- チケット一覧 -->
  <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-1">
    <div id="ticket-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- カードがJavaScriptで描画されます -->
    </div>

    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
      <p class="text-4xl mb-3">🎟️</p>
      <p class="font-bold text-slate-700">条件に合うチケットが見つかりませんでした</p>
      <p class="text-sm text-slate-500 mt-1">検索条件を変えるか、新しいチケットを出品してみてください。</p>
    </div>
  </main>

  <!-- フッター -->
  <footer class="border-t border-slate-200 bg-white py-5 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>ヒメチケ（HIME-TICKET）— 職場内チケット譲渡ボード</span>
      <span>受け渡し方法・金額の詳細は社内ルールに沿ってご確認ください</span>
    </div>
  </footer>

  <!-- 出品モーダル -->
  <div id="post-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
        <h2 class="font-bold text-lg">チケットを出品する</h2>
        <button id="close-post-modal-btn" type="button" class="text-slate-300 hover:text-white text-xl leading-none cursor-pointer">×</button>
      </div>

      <form id="post-ticket-form" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">イベント名・チケット名 *</label>
          <input
            name="title"
            type="text"
            required
            placeholder="例：〇〇フェス 1日券 / 映画ペア鑑賞券"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">開催日・有効期限 *</label>
            <input
              name="eventDate"
              type="text"
              required
              placeholder="例：2026年12月15日 / 2027年3月末まで"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">会場・利用場所</label>
            <input
              name="venue"
              type="text"
              placeholder="例：福岡PayPayドーム / 全国対象劇場"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">1枚あたり料金（税込円） *</label>
            <input
              name="price"
              type="number"
              min="0"
              step="1"
              required
              value="0"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
            />
            <p class="text-[11px] text-slate-500 mt-1">※0円入力で「無料」表示</p>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">譲渡可能枚数 *</label>
            <input
              name="quantity"
              type="number"
              min="1"
              step="1"
              required
              value="2"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">出品者名（部署・ニックネーム可） *</label>
            <input
              name="sellerName"
              type="text"
              required
              placeholder="例：営業部 川上"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">受け渡し方法</label>
            <input
              name="handover"
              type="text"
              placeholder="例：オフィス手渡し / 社内チャット送付"
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">備考・座席情報など</label>
          <textarea
            name="notes"
            rows="2"
            placeholder="例：急用で行けなくなったためお譲りします。連番希望優先です。"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
          ></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button
            id="cancel-post-btn"
            type="button"
            class="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition cursor-pointer"
          >
            キャンセル
          </button>
          <button
            type="submit"
            class="px-5 py-2.5 rounded-xl text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white shadow transition cursor-pointer"
          >
            出品を登録する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 譲り受け申込モーダル -->
  <div id="claim-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 bg-blue-700 text-white flex items-center justify-between">
        <h2 class="font-bold text-lg">チケットを譲り受ける</h2>
        <button id="close-claim-modal-btn" type="button" class="text-blue-100 hover:text-white text-xl leading-none cursor-pointer">×</button>
      </div>

      <form id="claim-ticket-form" class="p-6 space-y-4">
        <div id="claim-ticket-summary" class="rounded-xl bg-slate-50 border border-slate-200 p-3.5 text-sm">
          <!-- 対象チケット情報 -->
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">希望枚数 *</label>
          <input
            id="claim-quantity-input"
            name="claimQuantity"
            type="number"
            min="1"
            step="1"
            required
            value="1"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">お名前（部署・ニックネーム可） *</label>
          <input
            name="requesterName"
            type="text"
            required
            placeholder="例：企画部 佐藤"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">連絡メモ・受け渡し希望</label>
          <input
            name="requesterNote"
            type="text"
            placeholder="例：本日の15時以降にデスクへ伺えます"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none"
          />
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button
            id="cancel-claim-btn"
            type="button"
            class="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition cursor-pointer"
          >
            キャンセル
          </button>
          <button
            type="submit"
            class="px-5 py-2.5 rounded-xl text-sm font-bold bg-amber-400 hover:bg-amber-300 text-slate-950 shadow transition cursor-pointer"
          >
            譲り受けを確定する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase v10 (Modular ESM) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2u9hI8R0_yG7qK1vX5mN3pL8oW4eT6zY",
      authDomain: "himeticket-523fa.firebaseapp.com",
      projectId: "himeticket-523fa",
      storageBucket: "himeticket-523fa.appspot.com",
      messagingSenderId: "849201736512",
      appId: "1:849201736512:web:9c8d7e6f5a4b3c2d1e0f9a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ticketsCol = collection(db, "tickets");

    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const ticketCountEl = document.getElementById("ticket-count");
    const ticketGrid = document.getElementById("ticket-grid");
    const emptyState = document.getElementById("empty-state");
    const searchInput = document.getElementById("search-input");
    const filterButtons = document.querySelectorAll(".filter-btn");

    const postModal = document.getElementById("post-modal");
    const postForm = document.getElementById("post-ticket-form");
    const claimModal = document.getElementById("claim-modal");
    const claimForm = document.getElementById("claim-ticket-form");
    const claimSummary = document.getElementById("claim-ticket-summary");
    const claimQtyInput = document.getElementById("claim-quantity-input");

    let allTickets = [];
    let currentFilter = "all";
    let searchQuery = "";
    let selectedTicket = null;
    let seededOnce = false;

    const SAMPLE_TICKETS = [
      {
        title: "九州ウィンターイルミネーション 招待券",
        eventDate: "2026年12月25日まで有効",
        venue: "福岡市内特設会場",
        price: 0,
        quantity: 2,
        sellerName: "総務部 田中",
        handover: "社内チャット / 3F休憩室",
        notes: "ご家族や同僚の方とぜひどうぞ。期限内にご利用ください。",
        claims: []
      },
      {
        title: "年末スペシャルコンサート 指定席",
        eventDate: "2026年12月20日 18:00開演",
        venue: "福岡サンパレス",
        price: 5500,
        quantity: 2,
        sellerName: "開発部 鈴木",
        handover: "オフィス手渡し",
        notes: "定価以下でお譲りします。1枚からでも相談可能です。",
        claims: []
      }
    ];

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatPrice(price) {
      const num = Number(price) || 0;
      return num === 0 ? "無料" : `¥${num.toLocaleString("ja-JP")}`;
    }

    function setBannerStatus(mode, message) {
      statusText.textContent = message;
      statusDot.classList.remove("bg-amber-400", "bg-emerald-500", "bg-rose-500", "animate-pulse");
      if (mode === "ok") {
        statusDot.classList.add("bg-emerald-500");
      } else if (mode === "error") {
        statusDot.classList.add("bg-rose-500");
      } else {
        statusDot.classList.add("bg-amber-400", "animate-pulse");
      }
    }

    async function seedInitialTicketsIfEmpty() {
      if (seededOnce) return;
      seededOnce = true;
      for (const sample of SAMPLE_TICKETS) {
        await addDoc(ticketsCol, {
          ...sample,
          createdAt: serverTimestamp()
        });
      }
    }

    function renderTickets() {
      const qText = searchQuery.trim().toLowerCase();

      const filtered = allTickets.filter((t) => {
        const qty = Number(t.quantity) || 0;
        const price = Number(t.price) || 0;

        if (currentFilter === "available" && qty <= 0) return false;
        if (currentFilter === "free" && price !== 0) return false;

        if (!qText) return true;
        const haystack = [
          t.title,
          t.venue,
          t.sellerName,
          t.eventDate,
          t.notes
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return haystack.includes(qText);
      });

      ticketCountEl.textContent = `${filtered.length}件`;

      if (filtered.length === 0) {
        ticketGrid.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      ticketGrid.innerHTML = filtered
        .map((t) => {
          const qty = Number(t.quantity) || 0;
          const isAvailable = qty > 0;
          const priceLabel = formatPrice(t.price);
          const isFree = (Number(t.price) || 0) === 0;
          const claims = Array.isArray(t.claims) ? t.claims : [];

          return `
            <article class="bg-white rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition flex flex-col justify-between overflow-hidden">
              <div>
                <div class="px-5 pt-5 pb-3 flex items-start justify-between gap-2">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold ${
                    isAvailable
                      ? "bg-emerald-50 text-emerald-700 border border-emerald-200"
                      : "bg-slate-100 text-slate-500 border border-slate-200"
                  }">
                    ${isAvailable ? `残り ${qty} 枚` : "譲渡完了"}
                  </span>
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-extrabold ${
                    isFree
                      ? "bg-amber-100 text-amber-900"
                      : "bg-blue-50 text-blue-800"
                  }">
                    ${priceLabel} / 枚
                  </span>
                </div>

                <div class="px-5 pb-4">
                  <h3 class="text-lg font-extrabold text-slate-900 leading-snug">${escapeHtml(t.title)}</h3>
                  <dl class="mt-3 space-y-1.5 text-xs text-slate-600">
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">日時・期限</dt>
                      <dd class="text-slate-700 font-medium">${escapeHtml(t.eventDate || "未指定")}</dd>
                    </div>
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">会場・場所</dt>
                      <dd class="text-slate-700">${escapeHtml(t.venue || "未指定")}</dd>
                    </div>
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">出品者</dt>
                      <dd class="text-slate-700 font-semibold">${escapeHtml(t.sellerName || "社内メンバー")}</dd>
                    </div>
                    <div class="flex gap-2">
                      <dt class="font-bold text-slate-400 w-16 shrink-0">受け渡し</dt>
                      <dd class="text-slate-700">${escapeHtml(t.handover || "相談の上決定")}</dd>
                    </div>
                  </dl>

                  ${
                    t.notes
                      ? `<p class="mt-3 text-xs text-slate-600 bg-slate-50 rounded-xl p-3 border border-slate-100 leading-relaxed">${escapeHtml(t.notes)}</p>`
                      : ""
                  }

                  ${
                    claims.length > 0
                      ? `
                        <div class="mt-3 pt-3 border-t border-slate-100">
                          <p class="text-[11px] font-bold text-slate-500 mb-1.5">譲り受け履歴</p>
                          <ul class="space-y-1">
                            ${claims
                              .map(
                                (c) => `
                              <li class="text-xs text-slate-600 flex items-center justify-between bg-blue-50/60 px-2.5 py-1 rounded-lg">
                                <span>${escapeHtml(c.requesterName)}（${Number(c.quantity) || 1}枚）</span>
                                <span class="text-[11px] text-slate-400">${escapeHtml(c.note || "")}</span>
                              </li>`
                              )
                              .join("")}
                          </ul>
                        </div>`
                      : ""
                  }
                </div>
              </div>

              <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between gap-2">
                <span class="text-[11px] text-slate-400">ID: ${escapeHtml(t.id.slice(0, 6))}</span>
                ${
                  isAvailable
                    ? `<button
                        type="button"
                        data-claim-id="${escapeHtml(t.id)}"
                        class="claim-btn px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-xs transition cursor-pointer"
                      >
                        譲り受ける
                      </button>`
                    : `<span class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-200 text-slate-500">
                        受付終了
                      </span>`
                }
              </div>
            </article>
          `;
        })
        .join("");

      document.querySelectorAll(".claim-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-claim-id");
          const target = allTickets.find((item) => item.id === id);
          if (!target) return;
          openClaimModal(target);
        });
      });
    }

    // 出品モーダル制御
    function openPostModal() {
      postForm.reset();
      postModal.classList.remove("hidden");
      postModal.classList.add("flex");
    }

    function closePostModal() {
      postModal.classList.add("hidden");
      postModal.classList.remove("flex");
    }

    document.getElementById("open-post-modal-btn").addEventListener("click", openPostModal);
    document.getElementById("close-post-modal-btn").addEventListener("click", closePostModal);
    document.getElementById("cancel-post-btn").addEventListener("click", closePostModal);

    postForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(postForm);
      const price = Math.max(0, Number(fd.get("price")) || 0);
      const quantity = Math.max(1, Number(fd.get("quantity")) || 1);

      try {
        await addDoc(ticketsCol, {
          title: String(fd.get("title") || "").trim(),
          eventDate: String(fd.get("eventDate") || "").trim(),
          venue: String(fd.get("venue") || "").trim(),
          price,
          quantity,
          sellerName: String(fd.get("sellerName") || "").trim(),
          handover: String(fd.get("handover") || "").trim(),
          notes: String(fd.get("notes") || "").trim(),
          claims: [],
          createdAt: serverTimestamp()
        });
        closePostModal();
        setBannerStatus("ok", "チケットを出品しました。リアルタイムで反映されています。");
      } catch (err) {
        console.error(err);
        setBannerStatus("error", "出品の保存に失敗しました。Firestoreのルールや通信をご確認ください。");
      }
    });

    // 譲り受けモーダル制御
    function openClaimModal(ticket) {
      selectedTicket = ticket;
      const maxQty = Math.max(1, Number(ticket.quantity) || 1);
      claimQtyInput.max = String(maxQty);
      claimQtyInput.value = "1";
      claimSummary.innerHTML = `
        <p class="font-extrabold text-slate-900">${escapeHtml(ticket.title)}</p>
        <p class="text-xs text-slate-600 mt-1">出品者：${escapeHtml(ticket.sellerName)} ／ 料金：${formatPrice(ticket.price)} / 枚 ／ 残り ${maxQty} 枚</p>
      `;
      claimForm.reset();
      claimQtyInput.value = "1";
      claimModal.classList.remove("hidden");
      claimModal.classList.add("flex");
    }

    function closeClaimModal() {
      selectedTicket = null;
      claimModal.classList.add("hidden");
      claimModal.classList.remove("flex");
    }

    document.getElementById("close-claim-modal-btn").addEventListener("click", closeClaimModal);
    document.getElementById("cancel-claim-btn").addEventListener("click", closeClaimModal);

    claimForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!selectedTicket) return;

      const maxQty = Number(selectedTicket.quantity) || 0;
      const takeQty = Math.max(1, Math.min(maxQty, Number(claimQtyInput.value) || 1));
      const fd = new FormData(claimForm);
      const requesterName = String(fd.get("requesterName") || "").trim();
      const requesterNote = String(fd.get("requesterNote") || "").trim();

      const nextQty = Math.max(0, maxQty - takeQty);
      const nextClaims = [
        ...(Array.isArray(selectedTicket.claims) ? selectedTicket.claims : []),
        {
          requesterName,
          quantity: takeQty,
          note: requesterNote
        }
      ];

      try {
        const docRef = doc(db, "tickets", selectedTicket.id);
        await updateDoc(docRef, {
          quantity: nextQty,
          claims: nextClaims
        });
        closeClaimModal();
        setBannerStatus("ok", `${takeQty}枚の譲り受け登録が完了しました。残席を更新しました。`);
      } catch (err) {
        console.error(err);
        setBannerStatus("error", "譲り受け処理に失敗しました。通信状況をご確認ください。");
      }
    });

    // 検索・フィルタ
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value || "";
      renderTickets();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentFilter = btn.getAttribute("data-filter") || "all";
        filterButtons.forEach((b) => {
          const active = b === btn;
          b.className = active
            ? "filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition cursor-pointer"
            : "filter-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition cursor-pointer";
        });
        renderTickets();
      });
    });

    // Firestore リアルタイム購読
    const q = query(ticketsCol, orderBy("createdAt", "desc"));
    onSnapshot(
      q,
      async (snapshot) => {
        if (snapshot.empty && !seededOnce) {
          await seedInitialTicketsIfEmpty();
          return;
        }
        allTickets = snapshot.docs.map((d) => ({
          id: d.id,
          ...d.data()
        }));
        setBannerStatus("ok", "データベース（Firestore）とリアルタイム同期中です。");
        renderTickets();
      },
      (err) => {
        console.error(err);
        setBannerStatus("error", "データベース（Firestore）との通信を確認してください。");
      }
    );
  </script>
</body>
</html>
