<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヒメチケ｜職場内チケット譲渡ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bar:#1E2240; --ink:#1E2240; --ink-2:#5A5F7A;
  --accent:#C8254E; --accent-soft:#FBE8ED;
  --paper:#F3F4F8; --surface:#FFFFFF; --line:#E1E4EC;
  --gold:#9A6512; --gold-soft:#FDF1D6; --ok:#1F7A5A; --ok-soft:#E3F4EC; --mute:#8D91A6;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bar:#0F1124; --ink:#ECEDF5; --ink-2:#A7ABC2; --accent:#F0577D; --accent-soft:#40202C;
  --paper:#14162A; --surface:#1E2140; --line:#30345A;
  --gold:#F2C264; --gold-soft:#3C3220; --ok:#62D3A6; --ok-soft:#1D3A30; --mute:#7C809A;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}

/* ヘッダー */
.bar{background:var(--bar);color:#fff;position:sticky;top:0;z-index:20}
.bar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.logo{color:#fff;text-decoration:none;display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}
.logo b{font-family:var(--display);font-weight:400;font-size:26px}
.logo span{font-size:11px;opacity:.7;margin-top:3px}
.search{flex:1;display:flex;background:#fff;border-radius:6px;overflow:hidden;max-width:560px}
.search input{flex:1;min-width:0;border:0;padding:11px 14px;font:inherit;color:#1E2240;background:#fff}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px var(--accent)}
.search button{border:0;background:var(--accent);color:#fff;padding:0 20px;font-weight:700;cursor:pointer}
.post-link{margin-left:auto;color:#fff;text-decoration:none;font-weight:700;font-size:14px;border:1.5px solid rgba(255,255,255,.45);padding:8px 14px;border-radius:6px;white-space:nowrap}
.post-link:hover{background:rgba(255,255,255,.1)}

/* カテゴリタブ */
.cats{background:var(--surface);border-bottom:1px solid var(--line)}
.cats-in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;overflow-x:auto;scrollbar-width:none}
.cats-in::-webkit-scrollbar{display:none}
.cat-btn{border:0;background:none;font-weight:700;color:var(--ink-2);padding:14px 16px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.cat-btn:hover{color:var(--ink)}
.cat-btn[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.count{font-weight:700;margin-right:auto}
.count b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--accent);margin-right:3px}
.chip{border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sort{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:6px}

/* チケットカード */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;padding:0;position:relative}
.card:hover{border-color:var(--ink-2)}
.thumb{aspect-ratio:16/10;background:var(--c);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:24px}
.free{position:absolute;top:10px;left:10px;background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:700;padding:3px 9px;border-radius:4px}
.stub{display:flex;flex:1;border-top:2px dashed var(--line);position:relative}
.stub::before,.stub::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.stub::before{left:-9px}.stub::after{right:-9px}
.date{width:70px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0;border-right:1px solid var(--line)}
.date .m{font-size:12px;font-weight:700;color:var(--ink-2)}
.date .d{font-family:var(--display);font-size:30px;line-height:1.1}
.date .w{font-size:12px;color:var(--ink-2)}
.date.sun .w,.date.sun .d{color:var(--accent)}
.date.sat .w,.date.sat .d{color:#2F6FD0}
.date .tbd{font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;padding:0 6px}
.info{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.cat-tag{font-size:12px;font-weight:700;color:var(--c)}
@media (prefers-color-scheme:dark){.cat-tag{color:var(--ink-2)}}
.info h3{margin:0;font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.venue{margin:0;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.price{font-weight:700;font-size:18px}
.price small{font-size:12px;font-weight:500;color:var(--ink-2);margin-left:2px}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-few{background:var(--accent-soft);color:var(--accent)}
.st-end{background:var(--line);color:var(--ink-2)}
.card.sold .thumb{filter:grayscale(1);opacity:.55}
.card.sold .price{color:var(--mute)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:48px 20px;text-align:center;color:var(--ink-2)}
.empty a{color:var(--accent);font-weight:700}

/* 詳細ダイアログ */
dialog{border:0;padding:0;border-radius:12px;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(15,17,36,.6)}
.dl-img{aspect-ratio:16/10;background:var(--c);position:relative}
.dl-img img{width:100%;height:100%;object-fit:cover;display:block}
.dl-img .ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:30px}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(15,17,36,.65);color:#fff;font-size:20px;cursor:pointer;line-height:1}
.dl-body{padding:20px 22px 24px}
.dl-body h2{margin:4px 0 14px;font-size:21px;line-height:1.4}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 18px;font-size:14px}
.facts dt{color:var(--ink-2);font-weight:700}
.facts dd{margin:0;white-space:pre-wrap;word-break:break-word}
.buybox{background:var(--paper);border-radius:10px;padding:16px}
.buybox .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.buybox .big{font-family:var(--display);font-size:26px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:9px 11px}
.field textarea{min-height:64px;resize:vertical}
.req{color:var(--accent);font-size:11px;margin-left:4px}
.primary{width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:13px;border-radius:8px;cursor:pointer}
.primary:disabled{background:var(--mute);cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-2);margin:8px 0 0}
.msg-err{color:var(--accent);font-size:13px;font-weight:700;margin:6px 0 0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:8px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
footer{text-align:center;font-size:12px;color:var(--ink-2);padding:0 20px 32px}
footer a{color:inherit}

@media (max-width:640px){
  .bar-in{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .search{order:3;flex-basis:100%;max-width:none}
  main{padding:16px 14px 48px}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .date{width:54px}.date .d{font-size:24px}
  .info{padding:10px}
  .info h3{font-size:14px}
  .price{font-size:15px}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="logo" href="./"><b>ヒメチケ</b><span>職場内チケット譲渡ボード</span></a>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="イベント名・会場・出品者で探す" aria-label="キーワード検索">
      <button type="submit">検索</button>
    </form>
    <a class="post-link" href="admin.html">出品者ページ</a>
  </div>
</header>

<nav class="cats" aria-label="カテゴリ">
  <div class="cats-in" id="cats"></div>
</nav>

<main>
  <div class="toolbar">
    <p class="count" id="count" aria-live="polite">読み込み中…</p>
    <button class="chip" id="fAvail" aria-pressed="true">受付中のみ</button>
    <button class="chip" id="fFree" aria-pressed="false">無料</button>
    <select class="sort" id="sort" aria-label="並び替え">
      <option value="new">新着順</option>
      <option value="date">開催日が近い順</option>
      <option value="price">料金が安い順</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>ヒメチケは職員同士のチケット譲渡用です。チケット画像や備考に予約番号・QRコードを載せないでください。</footer>

<dialog id="detail" aria-labelledby="dTitle"></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, CATEGORIES } from "./firebase-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = (s) => document.querySelector(s);
const WEEK = ["日","月","火","水","木","金","土"];
const state = { tickets: [], cat: "all", q: "", avail: true, free: false, sort: "new" };

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const catOf = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
const yen = (n) => Number(n) === 0 ? "無料" : "¥" + Number(n || 0).toLocaleString("ja-JP");

function parseDate(s) {
  const m = String(s || "").match(/(\d{4})\s*[-\/年.]\s*(\d{1,2})\s*[-\/月.]\s*(\d{1,2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? null : d;
}
function dateBlock(t) {
  const d = parseDate(t.eventDate);
  if (!d) return `<div class="date"><span class="tbd">${esc(t.eventDate || "日程未定")}</span></div>`;
  const cls = d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "";
  return `<div class="date ${cls}"><span class="m">${d.getMonth() + 1}月</span><span class="d">${d.getDate()}</span><span class="w">(${WEEK[d.getDay()]})</span></div>`;
}
function dateText(t) {
  const d = parseDate(t.eventDate);
  const base = d ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）` : (t.eventDate || "未定");
  return t.eventTime ? `${base} ${t.eventTime}` : base;
}
function statusBadge(q) {
  q = Number(q || 0);
  if (q <= 0) return `<span class="status st-end">譲渡完了</span>`;
  if (q <= 2) return `<span class="status st-few">残りわずか ${q}枚</span>`;
  return `<span class="status st-ok">残り${q}枚</span>`;
}
function visual(t, cat, cls) {
  return t.imageUrl
    ? `<img src="${esc(t.imageUrl)}" alt="">`
    : `<span class="ph" aria-hidden="true">${esc(cat.label)}</span>`;
}

/* カテゴリタブ */
const tabs = [{ id: "all", label: "すべて" }, ...CATEGORIES];
$("#cats").innerHTML = tabs.map((c) => `<button class="cat-btn" data-cat="${c.id}" aria-pressed="${c.id === "all"}">${c.label}</button>`).join("");
$("#cats").addEventListener("click", (e) => {
  const b = e.target.closest(".cat-btn"); if (!b) return;
  state.cat = b.dataset.cat;
  document.querySelectorAll(".cat-btn").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
});

/* 絞り込み・検索・並び替え */
const toggle = (el, key) => el.addEventListener("click", () => { state[key] = !state[key]; el.setAttribute("aria-pressed", state[key]); render(); });
toggle($("#fAvail"), "avail"); toggle($("#fFree"), "free");
$("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
$("#searchForm").addEventListener("submit", (e) => { e.preventDefault(); state.q = $("#q").value.trim(); render(); });
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });

function filtered() {
  const q = state.q.toLowerCase();
  let list = state.tickets.filter((t) => {
    if (state.cat !== "all" && (t.category || "other") !== state.cat) return false;
    if (state.avail && Number(t.quantity || 0) <= 0) return false;
    if (state.free && Number(t.price) !== 0) return false;
    if (q) {
      const hay = [t.title, t.venue, t.sellerName, t.eventDate, t.notes, catOf(t.category).label].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (state.sort === "date") {
    list = [...list].sort((a, b) => (parseDate(a.eventDate)?.getTime() ?? Infinity) - (parseDate(b.eventDate)?.getTime() ?? Infinity));
  } else if (state.sort === "price") {
    list = [...list].sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
  }
  return list;
}

function render() {
  const list = filtered();
  $("#count").innerHTML = `<b>${list.length}</b>件のチケット`;
  if (!state.tickets.length) {
    $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1">まだ出品はありません。チケットを譲りたい方は<a href="admin.html">出品者ページ</a>から登録できます。</div>`;
    return;
  }
  if (!list.length) {
    $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1">条件に合うチケットはありません。カテゴリや絞り込みを変えてみてください。</div>`;
    return;
  }
  $("#grid").innerHTML = list.map((t) => {
    const cat = catOf(t.category);
    const sold = Number(t.quantity || 0) <= 0;
    return `<button class="card ${sold ? "sold" : ""}" data-id="${esc(t.id)}" style="--c:${cat.color}" aria-label="${esc(t.title)}の詳細を見る">
      <div class="thumb">${visual(t, cat)}${Number(t.price) === 0 && !sold ? `<span class="free">無料</span>` : ""}</div>
      <div class="stub">
        ${dateBlock(t)}
        <div class="info">
          <span class="cat-tag">${esc(cat.label)}</span>
          <h3>${esc(t.title)}</h3>
          <p class="venue">${esc(t.venue || "会場未定")}</p>
          <div class="row"><span class="price">${yen(t.price)}${Number(t.price) > 0 ? "<small>/枚</small>" : ""}</span>${statusBadge(t.quantity)}</div>
        </div>
      </div>
    </button>`;
  }).join("");
}

$("#grid").addEventListener("click", (e) => {
  const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id);
});

/* 詳細・譲り受け申込 */
const dlg = $("#detail");
function openDetail(id) {
  const t = state.tickets.find((x) => x.id === id); if (!t) return;
  const cat = catOf(t.category);
  const q = Number(t.quantity || 0);
  const claimsCount = Array.isArray(t.claims) ? t.claims.length : 0;
  const opts = Array.from({ length: Math.min(q, 10) }, (_, i) => `<option value="${i + 1}">${i + 1}枚</option>`).join("");
  dlg.style.setProperty("--c", cat.color);
  dlg.innerHTML = `
    <div class="dl-img">${visual(t, cat)}<button class="close" id="dClose" aria-label="閉じる">×</button></div>
    <div class="dl-body">
      <span class="cat-tag" style="--c:${cat.color}">${esc(cat.label)}</span>
      <h2 id="dTitle">${esc(t.title)}</h2>
      <dl class="facts">
        <dt>日時</dt><dd>${esc(dateText(t))}</dd>
        <dt>会場</dt><dd>${esc(t.venue || "未定")}</dd>
        <dt>受け渡し</dt><dd>${esc(t.handover || "出品者と相談")}</dd>
        <dt>出品者</dt><dd>${esc(t.sellerName)}</dd>
        ${t.notes ? `<dt>備考</dt><dd>${esc(t.notes)}</dd>` : ""}
      </dl>
      <div class="buybox">
        <div class="top"><span class="big">${yen(t.price)}${Number(t.price) > 0 ? '<small style="font-family:var(--body);font-size:13px"> /枚</small>' : ""}</span>${statusBadge(q)}</div>
        ${q > 0 ? `
        <form id="claimForm">
          <div class="field"><label for="cQty">枚数</label><select id="cQty">${opts}</select></div>
          <div class="field"><label for="cName">お名前（部署）<span class="req">必須</span></label><input id="cName" required maxlength="40" autocomplete="name"></div>
          <div class="field"><label for="cNote">出品者への連絡メモ</label><textarea id="cNote" maxlength="200" placeholder="内線番号や受け取りやすい時間など"></textarea></div>
          <button class="primary" type="submit" id="cBtn">譲り受けを申し込む</button>
          <p class="msg-err" id="cErr" hidden></p>
          <p class="hint">申込内容は出品者だけが確認できます。${claimsCount ? `現在 ${claimsCount}件の申込があります。` : ""}</p>
        </form>` : `<p class="hint" style="margin:0">このチケットは譲渡が完了しました。</p>`}
      </div>
    </div>`;
  dlg.showModal();
  $("#dClose").onclick = () => dlg.close();
  const f = $("#claimForm");
  if (f) f.onsubmit = (e) => { e.preventDefault(); claim(t.id); };
}
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

async function claim(id) {
  const n = Number($("#cQty").value);
  const name = $("#cName").value.trim();
  const note = $("#cNote").value.trim();
  const btn = $("#cBtn"), err = $("#cErr");
  if (!name) { err.textContent = "お名前を入力してください。"; err.hidden = false; return; }
  btn.disabled = true; btn.textContent = "申し込み中…"; err.hidden = true;
  try {
    await runTransaction(db, async (tx) => {
      const ref = doc(db, "tickets", id);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("gone");
      const d = snap.data();
      const left = Number(d.quantity || 0);
      if (left < n) throw new Error("short");
      const claims = Array.isArray(d.claims) ? d.claims : [];
      tx.update(ref, {
        quantity: left - n,
        claims: [...claims, { requesterName: name, quantity: n, note, at: new Date().toISOString() }]
      });
    });
    dlg.close();
    toast(`${n}枚の譲り受けを申し込みました。出品者からの連絡をお待ちください。`);
  } catch (e) {
    err.textContent = e.message === "short" ? "残り枚数が足りません。枚数を減らしてください。"
      : e.message === "gone" ? "このチケットは削除されました。"
      : "申し込めませんでした。通信状況を確認して、もう一度お試しください。";
    err.hidden = false; btn.disabled = false; btn.textContent = "譲り受けを申し込む";
  }
}

function toast(text) {
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 4000);
}

/* Firestore リアルタイム購読 */
onSnapshot(query(collection(db, "tickets"), orderBy("createdAt", "desc")),
  (snap) => {
    state.tickets = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  },
  () => {
    $("#count").textContent = "";
    $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1">チケットを読み込めませんでした。ページを再読み込みしてください。</div>`;
  });
</script>
</body>
</html>
